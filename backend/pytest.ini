[pytest]
# ---------------------------------------------------------------------------
# SangamX Backend – pytest configuration
# ---------------------------------------------------------------------------

# Auto-mode: every async test function is a coroutine; no need for
# @pytest.mark.asyncio on individual tests.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Tests live here
testpaths = tests

# Short tracebacks keep output readable; switch to 'long' when debugging
addopts = --tb=short -q
